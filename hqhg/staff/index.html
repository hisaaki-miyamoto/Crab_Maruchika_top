<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#17222d;--muted:#5b6977;--line:#d8dfe5;--sea:#2d5b7b;--bad:#b5432b}
@media (prefers-color-scheme:dark){:root{--bg:#0f151b;--card:#17202a;--ink:#e5ebf0;--muted:#9aa7b4;--line:#2a3743;--sea:#80b2d6;--bad:#e2775d}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 24px;width:min(380px,100%);display:grid;gap:14px}
h1{margin:0;font-size:18px} p{margin:0;font-size:13px;color:var(--muted)}
input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);width:100%}
button{font:inherit;font-size:15px;padding:10px;border:0;border-radius:8px;background:var(--sea);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
</style></head>
<body>
<form id="f">
  <h1>飲食事業部 目標と見込み</h1>
  <p>パスワードを入力してください。</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="パスワード" required>
  <button id="b" type="submit">開く</button>
  <div class="err" id="e" role="alert"></div>
</form>

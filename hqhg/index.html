<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#17222d;--muted:#5b6977;--line:#d8dfe5;--sea:#2d5b7b;--bad:#b5432b}
@media (prefers-color-scheme:dark){:root{--bg:#0f151b;--card:#17202a;--ink:#e5ebf0;--muted:#9aa7b4;--line:#2a3743;--sea:#80b2d6;--bad:#e2775d}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px 24px;width:min(380px,100%);display:grid;gap:14px}
h1{margin:0;font-size:18px} p{margin:0;font-size:13px;color:var(--muted)}
input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);width:100%}
button{font:inherit;font-size:15px;padding:10px;border:0;border-radius:8px;background:var(--sea);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;min-height:1.2em}
</style></head>

<form id="f">
  <h1>飲食事業部 経営ダッシュボード</h1>
  <p>パスワードを入力してください。</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="パスワード" required>
  <button id="b" type="submit">開く</button>
  <div class="err" id="e" role="alert"></div>
</form>

    var pw=new TextEncoder().encode(document.getElementById("pw").value.normalize("NFC"));
    var base=await crypto.subtle.importKey("raw",pw,"PBKDF2",false,["deriveBits"]);
    var bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:b64(D.s),iterations:D.n,hash:"SHA-256"},base,512));
    var hk=function(raw){return crypto.subtle.importKey("raw",raw,{name:"HMAC",hash:"SHA-256"},false,["sign"]);};
    var enc=await hk(bits.slice(0,32)),mac=await hk(bits.slice(32,64));
    var nonce=b64(D.v),ct=b64(D.c),tag=b64(D.t),msg=new Uint8Array(nonce.length+ct.length);msg.set(nonce);msg.set(ct,nonce.length);
    var t2=new Uint8Array(await crypto.subtle.sign("HMAC",mac,msg));
    if(t2.length!==tag.length||t2.some(function(x,i){return x!==tag[i];}))throw new Error("pw");
    var n=Math.ceil(ct.length/32),jobs=[];
    for(var i=0;i<n;i++){var blk=new Uint8Array(nonce.length+4);blk.set(nonce);blk[nonce.length]=(i>>>24)&255;blk[nonce.length+1]=(i>>>16)&255;blk[nonce.length+2]=(i>>>8)&255;blk[nonce.length+3]=i&255;jobs.push(crypto.subtle.sign("HMAC",enc,blk));}
    var ks=await Promise.all(jobs),pt=new Uint8Array(ct.length);
    for(var j=0;j<n;j++){var k=new Uint8Array(ks[j]);for(var q=0;q<32&&j*32+q<ct.length;q++)pt[j*32+q]=ct[j*32+q]^k[q];}
    var html=new TextDecoder().decode(pt);document.open();document.write(html);document.close();
  }catch(x){err.textContent="パスワードが違います。全角・半角もご確認ください。";btn.disabled=false;btn.textContent="開く";}
});
</script>
